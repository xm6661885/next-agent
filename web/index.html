<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F6F2E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201E1B" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Agents" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Agents</title>
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#F6F2E7;transition:opacity .35s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .mark{width:64px;height:64px;animation:sp-breathe 1.8s ease-in-out infinite}
      #splash .dots{display:flex;gap:8px}
      #splash .dots i{width:7px;height:7px;border-radius:50%;background:#fbc7d1;animation:sp-dot 1.2s ease-in-out infinite}
      #splash .dots i:nth-child(2){animation-delay:.15s}
      #splash .dots i:nth-child(3){animation-delay:.3s}
      @keyframes sp-breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
      @keyframes sp-dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
      @media (prefers-color-scheme: dark){#splash{background:#201E1B}}
      @media (prefers-reduced-motion: reduce){#splash .mark,#splash .dots i{animation:none}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="28" fill="#fbc7d1"/>
        <path d="M32 16l3.6 10.4L46 30l-10.4 3.6L32 44l-3.6-10.4L18 30l10.4-3.6z" fill="#fff"/>
      </svg>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
